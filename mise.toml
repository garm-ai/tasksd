# Toolchain and tasks for tasksd. `mise install` gets you a working checkout;
# `mise run ci` is exactly what CI runs.
#
# Task names match every other garm-ai repository on purpose: `mise run test`
# means the same thing everywhere, so moving between them costs no
# relearning.

[tools]
go = "1.26"
# buf, because this repository owns a contract now: `garm.tasks.v1` is under
# proto/ and the Go under gen/ is generated from it rather than imported from
# somewhere else.
buf = "1"

[tasks.gen]
description = "Regenerate Go from the contract"
# proto/ only; buf.gen.yaml says why third_party/proto must never be
# generated. It is one line because there is one template and one package.
run = "buf generate"

[tasks."gen-check"]
description = "Fail if the committed generated code is stale"
# Generated code is COMMITTED, because a Go module has to build from its own
# source: a consumer runs `go build`, not buf and a remote plugin. The cost of
# committing is drift, and this is the check that pays it — and it matters more
# here than in a repository that only consumes a contract, because what gen/
# says is what this service ADVERTISES. A stale gen/ is a descriptor hash that
# does not match the proto anybody reads, and the symptom is a daemon
# quarantining the service with a mismatch nobody can reproduce from the file.
#
# A generated file that exists but was never added is stale the same way, so
# the untracked check is there beside the diff. `ls-files --others`, not
# `status`: status folds an untracked directory into one "?? gen/" line that no
# pathspec under it matches, and lists staged files too, which are not stale.
#
# Scoped to gen/ on purpose. Checking the whole tree would fail on any
# unrelated edit in the working directory, which is right in CI and misleading
# everywhere else — and a check that cries wolf locally is one people stop
# running before they push.
#
# wait_for, not depends: mise runs dependencies in parallel, and `buf generate`
# rewriting a .pb.go while `go build` reads it is a flaky red.
wait_for = ["build", "test", "lint"]
run = """
mise run gen
if ! git diff --quiet -- gen; then
  echo "generated code is stale — run 'mise run gen' and commit:" >&2
  git diff --stat -- gen >&2
  exit 1
fi
untracked=$(git ls-files --others --exclude-standard -- gen)
if [ -n "$untracked" ]; then
  echo "generated code is untracked — run 'git add' on:" >&2
  printf '%s\\n' "$untracked" >&2
  exit 1
fi
echo "ok: gen/ matches proto/"
"""

[tasks."buf-lint"]
description = "Lint the contract"
run = "buf lint"

[tasks.breaking]
description = "Fail if the contract broke against the last release"
# This repository publishes a contract, so it owes consumers the check the
# contract module owes them. Against the LATEST TAG rather than main: main is
# where a breaking change lands deliberately with a version bump beside it, and
# the question worth asking is whether what people have already pinned still
# means what it meant.
#
# No tag yet is not a failure — a fresh clone with no tags has nothing to
# compare against — but a tag that exists and a comparison that fails is the
# real signal.
#
# Nor is a tag from before this repository owned a contract. Every release up
# to v0.2.1 has no proto/ at all, and `buf breaking` against one of those does
# not report a break, it reports `Module had no .proto files` and exits 1 —
# which is a check failing because it cannot run, and the most reliable way to
# get a check deleted. So the tree is asked whether the tag has protos before
# the comparison is attempted, and the check turns itself on at the first
# release that carries them.
run = """
set -e
tag="$(git tag --sort=-v:refname | head -1)"
if [ -z "$tag" ]; then
  echo "no tag to compare against; the check turns on with the first release"
  exit 0
fi
if ! git ls-tree -r --name-only "$tag" -- proto | grep -q '\\.proto$'; then
  echo "$tag predates this repository owning a contract; nothing to compare against"
  exit 0
fi
echo "== buf breaking --against $tag"
buf breaking --against ".git#tag=$tag"
"""

[tasks.build]
description = "Build every package"
run = "go build ./..."

[tasks.test]
description = "Run the tests"
# -timeout because Go's default is ten minutes, and a test waiting on a
# Postgres or a broker that never answers will sit there for all of it.
#
# The race detector runs over everything, the wire-level suite included.
# It could not until tool-go v0.6.0: a handler ran in a goroutine of its
# own while nats.go's micro read that request's error field after the
# handler returned, so any tool service answering a coded refusal tripped
# the detector inside those two libraries. tool-go answers synchronously
# now, and there is nothing left here to exempt.
run = "go test ./... -race -count=1 -timeout 300s"

[tasks.lint]
description = "Vet the Go"
run = "go vet ./..."

[tasks.fmt]
description = "Format the Go"
# Go only, and no `buf format -w`. The protos here are kept byte for byte as
# they arrived from `github.com/garm-ai/contracts` v0.5.0 — the contract apart
# from its `go_package` and its header comment, and the three vendored files
# under third_party/proto exactly. `diff` against that tag is how somebody
# checks the descriptor-hash claim in KNOWN-GAPS.md instead of taking it on
# trust, and reformatting would spend that for nothing: buf's formatter moves
# the option and import order and reflows every message option in all four
# files, and none of it reaches a descriptor. There is nothing to reformat once
# the contract module's copy is gone either, since the file will not have
# changed.
run = "go fmt ./..."

[tasks."fmt-check"]
description = "Fail if anything is unformatted"
run = """
out=$(gofmt -l ./cmd ./internal .)
if [ -n "$out" ]; then
  echo "unformatted — run 'mise run fmt':" >&2
  echo "$out" >&2
  exit 1
fi
"""

[tasks."tidy-check"]
description = "Fail if go.mod or go.sum is not tidy"
run = """
go mod tidy -diff || { echo "not tidy: run 'go mod tidy'" >&2; exit 1; }
echo "ok: go.mod and go.sum are tidy"
"""

[tasks.pg]
description = "A throwaway Postgres for the store and wire tests"
# The tests read POSTGRES_DSN and skip when it is unset. This is the one
# command that makes them run locally.
run = """
docker rm -f tasksd-pg >/dev/null 2>&1 || true
docker run -d --name tasksd-pg -e POSTGRES_PASSWORD=tasksd -e POSTGRES_USER=tasksd \\
  -e POSTGRES_DB=tasksd -p 5440:5432 postgres:17-alpine >/dev/null
echo 'export POSTGRES_DSN=postgres://tasksd:tasksd@127.0.0.1:5440/tasksd?sslmode=disable'
"""

[tasks."no-enforcement"]
description = "Fail if this service can reach the daemon or a token minter"
# A tool service must not be able to enforce, and must not be able to mint an
# identity: either one in this dependency graph means something in a request
# path could decide what it is only supposed to be told. The assignment is on
# its own line because a `go list` that fails inside an `if` reads as a clean
# check, and the empty-output guard covers a list that succeeds and prints
# nothing.
run = """
deps=$(go list -deps -test ./...)
if [ -z "$deps" ]; then
  echo "go list produced no output at all; that is a broken check, not a clean one" >&2
  exit 1
fi
if echo "$deps" | grep -qE 'garm-ai/(garmd|sts|devkit)'; then
  echo "tasksd reaches the daemon or a token minter:" >&2
  echo "$deps" | grep -E 'garm-ai/(garmd|sts|devkit)' >&2
  exit 1
fi
echo "ok: no path to the daemon or to a token minter"
"""

[tasks."no-old-contracts"]
description = "Fail if the module the contracts left is back in the build graph"
# This one is not a dependency policy and nothing is gained by granting it an
# exception: `github.com/garm-ai/garm` and `github.com/garm-ai/contracts`
# register the SAME protobuf descriptor file paths, so a binary linking both
# dies in `protoregistry` at init. It compiles cleanly and then does not
# start, which is exactly why this is a check rather than a note — `go build`
# is green either way and only running the binary tells you. That happened to
# real binaries on 2026-09-29. The failure message says all of it, because the
# person who trips this in six months reads the output and not this comment.
#
# Anchored on the module path. `github.com/garm-ai/garm` and its packages must
# fail; `github.com/garm-ai/garmd` must not, and neither must a future
# `github.com/garm-ai/garm-anything`. A bare `grep garm-ai/garm` matches the
# daemon and every consumer, which is a check that fails for the wrong reason
# and then gets loosened until it fails for none.
#
# Same `go list` lesson as `no-enforcement`: the assignment is on its own line
# and its exit code is checked first, because a `go list` that fails inside an
# `if` reads as a clean check, and the empty-output guard covers a `go list`
# that succeeds and prints nothing.
#
# And the graph is read under more than one set of build inputs, because one
# `go list` is not the whole build: `./...` is what ships, and `-test ./...`
# adds the test-only imports, where a duplicate registration is just as fatal
# — it panics in package init, so `go test` never reaches a test function. If
# this repository ever grows a `//go:build` tag, that tag set belongs in this
# list too; a dependency reachable only under a tag is invisible to a single
# default-tag `go list`.
run = """
found=0
for graph in "./..." "-test ./..."; do
  deps=$(go list -deps $graph) || exit 1
  if [ -z "$deps" ]; then
    echo "go list -deps $graph printed nothing; that is a broken check, not a clean one" >&2
    exit 1
  fi
  bad=$(printf '%s\\n' "$deps" | grep -E '^github\\.com/garm-ai/garm(/|$)' || true)
  if [ -n "$bad" ]; then
    found=1
    echo "reachable under: go list -deps $graph" >&2
    printf '%s\\n' "$bad" | sed 's|^|  |' >&2
  fi
done
if [ "$found" -eq 1 ]; then
  cat >&2 <<'WHY'

github.com/garm-ai/garm is back in tasksd's build graph.

This is not a dependency policy and there is no exception to add. The
contracts left that module for github.com/garm-ai/contracts in September
2026, and both modules still register the same protobuf descriptor file
paths — garm/tool/v1/attribution.proto and the rest. A process that links
both panics in protoregistry during package init:

  panic: proto: file "garm/tool/v1/attribution.proto" is already registered

So the symptom is a binary that builds, passes every test that does not link
both, and then dies at startup before main. That is what this check exists to
catch, because nothing else in CI will.

To fix it, move the dependency rather than this check:

  * a direct import of github.com/garm-ai/garm/... becomes the matching
    package under github.com/garm-ai/contracts/...
  * if it arrived transitively, `go mod why github.com/garm-ai/garm` names the
    consumer that has not migrated yet — bump it to a release that has
  * github.com/garm-ai/tool-go before v0.6.0 is still on the old module, so a
    downgrade there brings this straight back

WHY
  exit 1
fi
echo "ok: the contracts' old module is in neither build graph"
"""

[tasks."one-tasks-contract"]
description = "Fail if the contract module's copy of garm.tasks.v1 is back in the graph"
# `garm.tasks.v1` moved out of `github.com/garm-ai/contracts` and into this
# repository, and until the switchover lands there it exists in BOTH modules.
# That is safe for exactly one reason: nothing links both. The two copies
# register the same descriptor file path, `garm/tasks/v1/tasks.proto`, so a
# binary that reaches both dies in `protoregistry` during package init —
# builds, vets, links, and then does not start. This is the check that keeps
# the reason true rather than remembered, and it retires when the package is
# gone from the contract module.
#
# It is deliberately narrow. This repository still REQUIRES that module, for
# `garm/tool/v1`, `garm/card/v1`, `wire`, `callctx`, `grant` and `grants`, and
# gen/garm/tasks/v1 imports three of those itself — so the module path is not
# what is forbidden, one package under it is.
#
# Same two graphs and the same `go list` lesson as `no-old-contracts`: the
# assignment is on its own line with its exit code checked first, because a
# `go list` that fails inside an `if` reads as a clean check; the empty-output
# guard covers a `go list` that succeeds and prints nothing; and `-test ./...`
# is read as well as `./...`, because a duplicate registration panics in init
# and so kills a test binary before it reaches a test function.
run = """
found=0
for graph in "./..." "-test ./..."; do
  deps=$(go list -deps $graph) || exit 1
  if [ -z "$deps" ]; then
    echo "go list -deps $graph printed nothing; that is a broken check, not a clean one" >&2
    exit 1
  fi
  bad=$(printf '%s\\n' "$deps" | grep -E '^github\\.com/garm-ai/contracts/garm/tasks/v1$' || true)
  if [ -n "$bad" ]; then
    found=1
    echo "reachable under: go list -deps $graph" >&2
    printf '%s\\n' "$bad" | sed 's|^|  |' >&2
  fi
done
if [ "$found" -eq 1 ]; then
  cat >&2 <<'WHY'

The contract module's copy of garm.tasks.v1 is back in tasksd's build graph.

This repository owns that package now: proto/garm/tasks/v1/tasks.proto,
generated into gen/garm/tasks/v1. Until the switchover removes it from
github.com/garm-ai/contracts the package exists in two modules, and a process
that links both registers the same descriptor file twice:

  panic: proto: file "garm/tasks/v1/tasks.proto" is already registered

So the symptom is a binary that builds, passes every test that does not link
both, and then dies at startup before main.

To fix it, move the import rather than this check:

  * github.com/garm-ai/contracts/garm/tasks/v1 becomes
    github.com/garm-ai/tasksd/gen/garm/tasks/v1 — the same Go package name,
    tasksv1, so the call sites do not change
  * if it arrived transitively, `go mod why -m` and
    `go list -deps -test ./...` name the consumer that pulls it

Every other package under github.com/garm-ai/contracts is fine and expected:
garm/tool/v1, garm/card/v1, wire, callctx, grant and grants all still come
from there, and gen/garm/tasks/v1 imports three of them itself.

WHY
  exit 1
fi
echo "ok: one copy of garm.tasks.v1 in the build graph, and it is this repository's"
"""

[tasks."no-replace"]
description = "Fail on a replace directive"
# Every dependency is a real, resolvable version. A replace pointing at a
# local checkout is invisible to `go install` and to CI from a clean clone.
run = """
if grep -Eq '^\\s*replace\\s' go.mod; then
  echo "go.mod carries a replace directive" >&2
  exit 1
fi
echo "ok: no replace directive"
"""

[tasks.ci]
description = "Everything CI runs"
depends = [
  "fmt-check",
  "lint",
  "buf-lint",
  "build",
  "test",
  "gen-check",
  "breaking",
  "tidy-check",
  "no-enforcement",
  "no-old-contracts",
  "one-tasks-contract",
  "no-replace",
]
