# CI for tasksd.
#
# One job. The store and wire tests need a real Postgres, so the workflow
# brings one up as a service container and hands its DSN to the tests — a
# fake would be testing the fake, and the failures worth catching here are
# constraint violations and the behaviour of an update that matches no rows.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tasksd
          POSTGRES_PASSWORD: tasksd
          POSTGRES_DB: tasksd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tasksd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DSN: postgres://tasksd:tasksd@127.0.0.1:5432/tasksd?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with: { install: true, cache: true }
      # Formatting, vet, build, the tests with a real Postgres, tidiness of
      # go.mod, and four boundary checks: no path to the daemon or to a token
      # minter, no path back to `github.com/garm-ai/garm` — the module the
      # contracts left — no second copy of `garm.tasks.v1`, which this
      # repository now publishes and `github.com/garm-ai/contracts` still does
      # too until the switchover, and no replace directive. The two descriptor
      # checks exist because a binary that registers one file twice builds,
      # vets, links and then panics in `protoregistry` before `main`.
      #
      # Plus the contract itself: `buf lint`, `buf breaking` against the last
      # release, and `gen-check`, which regenerates `gen/` and refuses a copy
      # that has drifted from `proto/`. That one reaches buf.build for the
      # pinned protoc-gen-go plugin and for the protovalidate dependency in
      # buf.lock, so this job needs the network it already has.
      - run: mise run ci
